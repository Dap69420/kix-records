<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel · KIX RECORDS</title>
    <meta name="description" content="KIX RECORDS release management admin panel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">
        <img src="assets/logo.png" alt="KIX Records logo" />
        <span>KIX RECORDS</span>
      </a>
      <nav class="site-nav">
        <a href="index.html#updates">Updates</a>
        <a href="index.html#releases">Releases</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="auth-actions">
        <a class="ghost hidden" data-admin-link href="admin.html">Admin</a>
        <span class="auth-username hidden" data-auth-username></span>
        <button class="ghost" type="button" data-auth-toggle data-open-auth>Login</button>
        <a class="cta" href="submit-demo.html">Submit demo</a>
      </div>
    </header>

    <main class="admin-page">
      <section class="section-title admin-title">
        <h2>Admin Panel</h2>
        <p>Manage releases and updates from one place.</p>
      </section>

      <section class="admin-tabs" role="tablist" aria-label="Admin sections">
        <button class="admin-tab active" type="button" data-admin-tab="releases">Releases</button>
        <button class="admin-tab" type="button" data-admin-tab="updates">Updates</button>
      </section>

      <section class="admin-panel active" data-admin-panel="releases">
        <div class="admin-grid">
          <div class="admin-card">
            <h3>Add New Release</h3>
            <form id="admin-release-form" class="admin-form">
              <div class="input-group full">
                <label for="admin-release-name">Release Name</label>
                <input id="admin-release-name" type="text" required placeholder="ASTROTEKK" />
              </div>
              <div class="input-group full">
                <label for="admin-artist-names">Artist Names</label>
                <input id="admin-artist-names" type="text" required placeholder="DJ KITSXU" />
              </div>
              <div class="input-group full">
                <label for="admin-cover-art-url">Cover Art Image Link</label>
                <input id="admin-cover-art-url" type="url" required placeholder="https://..." />
              </div>
              <div class="input-group full">
                <label for="admin-release-url">Release Link</label>
                <input id="admin-release-url" type="url" required placeholder="https://..." />
              </div>
              <div class="input-group full">
                <label for="admin-release-date">Release Date</label>
                <input id="admin-release-date" type="date" required />
              </div>
              <button class="cta" type="submit">Add Release</button>
              <p id="admin-form-status" class="auth-status"></p>
            </form>
          </div>

          <div class="admin-card">
            <h3>All Releases (Latest to Oldest)</h3>
            <div id="admin-release-list" class="admin-release-list"></div>
          </div>
        </div>
      </section>

      <section class="admin-panel" data-admin-panel="updates">
        <div class="admin-grid">
          <div class="admin-card">
            <h3>Add New Update</h3>
            <form id="admin-update-form" class="admin-form">
              <div class="input-group full">
                <label for="admin-update-badge">Badge</label>
                <input id="admin-update-badge" type="text" required placeholder="Latest" />
              </div>
              <div class="input-group full">
                <label for="admin-update-title">Title</label>
                <input id="admin-update-title" type="text" required placeholder="Website Launched" />
              </div>
              <div class="input-group full">
                <label for="admin-update-date">Display Date</label>
                <input id="admin-update-date" type="text" required placeholder="e.g. February 2026" />
              </div>
              <div class="input-group full">
                <label for="admin-update-content">Content</label>
                <textarea id="admin-update-content" rows="4" required placeholder="Write update details..."></textarea>
              </div>
              <button class="cta" type="submit">Add Update</button>
              <p id="admin-update-form-status" class="auth-status"></p>
            </form>
          </div>

          <div class="admin-card">
            <h3>All Updates (Latest to Oldest)</h3>
            <div id="admin-update-list" class="admin-release-list"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal" id="auth-modal">
      <div class="modal-content auth-modal-content">
        <div class="auth-container">
          <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="login">Sign In</button>
            <button type="button" class="auth-tab" data-tab="register">Create Account</button>
          </div>

          <form id="login-form" class="auth-form active">
            <div class="input-group full">
              <label for="login-username">Username</label>
              <input id="login-username" type="text" placeholder="your_username" required />
            </div>
            <div class="input-group full">
              <label for="login-password">Password</label>
              <input id="login-password" type="password" placeholder="Enter password" autocomplete="current-password" required />
            </div>
            <div class="input-group full">
              <label for="login-security-question-text">Security Question</label>
              <input id="login-security-question-text" type="text" readonly placeholder="Security question will appear after username/password" />
            </div>
            <div class="input-group full hidden" id="login-security-answer-group">
              <label for="login-security-answer">Security Answer</label>
              <input id="login-security-answer" type="text" placeholder="Enter your answer" />
            </div>
            <button type="submit" class="cta full" id="login-submit-btn">Continue</button>
            <p class="auth-status" id="login-status"></p>
          </form>

          <form id="register-form" class="auth-form">
            <div class="input-group full">
              <label for="register-username">Username</label>
              <input id="register-username" type="text" placeholder="your_username" required />
            </div>
            <div class="input-group full">
              <label for="register-security-question">Security Question</label>
              <select id="register-security-question" required>
                <option value="">Select a security question</option>
                <option value="What is your favourite game?">What is your favourite game?</option>
                <option value="What was your childhood nickname?">What was your childhood nickname?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your favourite artist?">What is your favourite artist?</option>
              </select>
            </div>
            <div class="input-group full">
              <label for="register-security-answer">Security Answer</label>
              <input id="register-security-answer" type="text" placeholder="Enter your answer" required />
            </div>
            <div class="input-group full">
              <label for="register-password">Password</label>
              <input id="register-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />
            </div>
            <div class="input-group full">
              <label for="register-confirm-password">Confirm Password</label>
              <input id="register-confirm-password" type="password" placeholder="Confirm password" autocomplete="new-password" required />
            </div>
            <button type="submit" class="cta full">Create Account</button>
            <p class="auth-status" id="register-status"></p>
          </form>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
  </body>
</html>
